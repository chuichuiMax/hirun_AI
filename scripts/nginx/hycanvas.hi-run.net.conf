# HyCanvas HTTPS 入口。证书使用 *.hi-run.net 通配符。
# 安装：复制到 /etc/nginx/sites-enabled/hycanvas.hi-run.net 后执行 nginx -t && systemctl reload nginx
# DNS：将 hycanvas.hi-run.net 的 A 记录指向与 ai.hi-run.net 相同的公网 IP。

server {
    listen 80;
    listen [::]:80;
    server_name hycanvas.hi-run.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hycanvas.hi-run.net;

    ssl_certificate     /opt/contentSwarm/certs/hi-run.net.pem;
    ssl_certificate_key /opt/contentSwarm/certs/hi-run.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
    }
}
